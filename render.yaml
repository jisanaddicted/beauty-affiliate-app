services:
  - type: web
    name: beauty-affiliate-platform
    runtime: node
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SAAS_APP_URL
        value: https://videoomniverse.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
